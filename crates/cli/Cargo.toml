[package]
name = "fmtkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Formats and checks Go, TypeScript, JavaScript, Vue, HTML, and Markdown repositories."

# The workspace is publish = false; this opts the binary into cargo-dist.
[package.metadata.dist]
dist = true

[[bin]]
name = "fmtkit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fmtkit-cache.workspace = true
fmtkit-config.workspace = true
fmtkit-core.workspace = true
fmtkit-discover.workspace = true
fmtkit-engine.workspace = true
fmtkit-report.workspace = true
mimalloc.workspace = true
postcard.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
