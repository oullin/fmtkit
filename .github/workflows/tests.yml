name: Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
            # No `edited`: bots rewrite the description after every push, and a
            # run with skipped jobs replaces the real checks on the pull request.
            # A pull request retargeted to main runs on its next push.

permissions:
    contents: read

# A new push to a pull request supersedes the run before it. Other runs get a
# group of their own, so a main commit's suite is never cancelled: tag.yml tags
# a release once this workflow passes on main.
concurrency:
    group: tests-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    CARGO_TERM_COLOR: always
    # scripts/lib/env.sh keeps the Go caches under storage/; naming them here
    # too is what lets setup-go find, restore and save them.
    GOCACHE: ${{ github.workspace }}/storage/.cache/go-build
    GOMODCACHE: ${{ github.workspace }}/storage/.cache/gopath/pkg/mod

# Swatinem/rust-cache: scripted builds go to storage/target, not ./target.
# Only main saves; a pull request restores the cache of the main commit it
# branched from and rebuilds just the workspace crates. Saving per pull request
# would push the repository over its 10 GB cache quota and evict main's.
#
# The test profiles keep line tables only: panics still name file and line,
# and the cached target dir is a fraction of the size.
jobs:
    lint:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo
              with:
                  prefix-key: v1-rust
                  workspaces: '. -> storage/target'
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: rustfmt, clippy, gofmt and go vet
              run: ./scripts/task.sh lint

    # Linux runs the same Rust and Go suites (Go with -race) in the coverage
    # job, so only macOS needs a plain test run.
    test:
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - macos-15
        runs-on: ${{ matrix.runner }}
        env:
            CARGO_PROFILE_DEV_DEBUG: line-tables-only

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo
              with:
                  prefix-key: v1-rust
                  workspaces: '. -> storage/target'
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Rust workspace and Go helper tests
              run: ./scripts/task.sh test

    coverage:
        runs-on: ubuntu-24.04
        env:
            CARGO_PROFILE_DEV_DEBUG: line-tables-only

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: |
                  rustup toolchain install
                  rustup component add llvm-tools-preview

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo
              with:
                  prefix-key: v1-rust
                  workspaces: '. -> storage/target'
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: taiki-e/install-action@v2
              name: Install cargo-llvm-cov
              with:
                  tool: cargo-llvm-cov

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Enforce the coverage gates
              run: ./scripts/task.sh coverage

            - uses: codecov/codecov-action@v7.1.1
              name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: storage/.cache/lcov.info,storage/.cache/go-helper.cover.out
                  override_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
                  fail_ci_if_error: false

    binary:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            # bench.yml restores this release-profile cache under the same key.
            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo
              with:
                  prefix-key: v1-rust
                  shared-key: release
                  workspaces: '. -> storage/target'
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Smoke test the release binary and its install layouts
              run: ./scripts/test-binary-smoke.sh

            - name: Smoke test the Docker image
              run: ./scripts/test-docker-smoke.sh

            # The only tool that can say whether this tree is formatted is
            # fmtkit itself.
            - name: Check the repository is fmtkit-formatted
              run: ./scripts/task.sh self-check
