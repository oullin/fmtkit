name: Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
            - edited
    # tag.yml runs the suite before it tags a release.
    workflow_call:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    CARGO_TERM_COLOR: always

jobs:
    lint:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: rustfmt, clippy, gofmt and go vet
              run: ./scripts/task.sh lint

    test:
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-24.04
                    - macos-15
        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Rust workspace and Go helper tests
              run: ./scripts/task.sh test

    coverage:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: |
                  rustup toolchain install
                  rustup component add llvm-tools-preview

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo

            - uses: taiki-e/install-action@v2
              name: Install cargo-llvm-cov
              with:
                  tool: cargo-llvm-cov

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Enforce the coverage gates
              run: ./scripts/task.sh coverage

            - uses: codecov/codecov-action@v7.1.1
              name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: storage/.cache/lcov.info,storage/.cache/go-helper.cover.out
                  override_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
                  fail_ci_if_error: false

    binary:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            - name: Smoke test the release binary and its install layouts
              run: ./scripts/test-binary-smoke.sh

            - name: Smoke test the Docker image
              run: ./scripts/test-docker-smoke.sh

            # The only tool that can say whether this tree is formatted is
            # fmtkit itself.
            - name: Check the repository is fmtkit-formatted
              run: ./scripts/task.sh self-check
