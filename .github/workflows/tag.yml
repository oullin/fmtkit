name: Release Tag

# Tags v<version> from Cargo.toml once the suite passes on main, then starts
# release.yml (generated by cargo-dist) for that tag. Merges that do not bump
# the version tag nothing. Nothing is tagged unless the repository variable
# RELEASES is set to "enabled".
#
# It waits on the Tests run that the push to main already starts rather than
# running the suite a second time, and tags the commit that run tested.
# Re-running a failed Tests run on main re-triggers this workflow.
on:
    workflow_run:
        workflows:
            - Tests
        types:
            - completed
        branches:
            - main

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
    group: release-tag-main
    cancel-in-progress: false

jobs:
    create_tag:
        if: >-
            vars.RELEASES == 'enabled'
            && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.version.outputs.new_tag }}

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Create release tag
              id: version
              run: ./scripts/release/create-release-tag.sh

    # A tag pushed with GITHUB_TOKEN does not trigger other workflows, but a
    # workflow_dispatch sent with it does.
    publish_release:
        needs: create_tag
        if: needs.create_tag.outputs.tag != ''
        runs-on: ubuntu-24.04
        permissions:
            actions: write

        steps:
            - name: Start the cargo-dist release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.create_tag.outputs.tag }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
