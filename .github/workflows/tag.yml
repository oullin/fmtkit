name: Release Tag

# Tags v<version> from Cargo.toml once the suite passes on main, then starts
# release.yml (generated by cargo-dist) for that tag. Merges that do not bump
# the version tag nothing. Nothing is tagged unless the repository variable
# RELEASES is set to "enabled".
on:
    push:
        branches:
            - main

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
    group: release-tag-main
    cancel-in-progress: false

jobs:
    tests:
        uses: ./.github/workflows/tests.yml
        secrets: inherit

    create_tag:
        needs: tests
        if: vars.RELEASES == 'enabled'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.version.outputs.new_tag }}

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Create release tag
              id: version
              run: ./scripts/release/create-release-tag.sh

    # A tag pushed with GITHUB_TOKEN does not trigger other workflows, but a
    # workflow_dispatch sent with it does.
    publish_release:
        needs: create_tag
        if: needs.create_tag.outputs.tag != ''
        runs-on: ubuntu-24.04
        permissions:
            actions: write

        steps:
            - name: Start the cargo-dist release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.create_tag.outputs.tag }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
