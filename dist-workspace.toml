[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. The shell installer is not offered:
# it installs only the binaries and would drop the Go helper.
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "oullin/homebrew-fmtkit"
# Customize the Homebrew formula name
formula = "fmtkit"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-docker"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Ship the Go helper in every archive; the formula installs it to pkgshare,
# which the helper lookup checks (crates/go/src/locate.rs).
include = ["storage/go-helper/fmtkit-go-helper"]
# Build the helper for each target before `dist build`.
github-build-setup = "../build-setup.yml"
# Releases start from tag.yml through workflow_dispatch: a tag pushed with
# GITHUB_TOKEN would not trigger a tag-push workflow.
dispatch-releases = true
