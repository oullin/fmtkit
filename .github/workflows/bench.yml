name: Benchmark

# Fails a pull request that makes fmtkit more than 10% slower than its base
# branch on a pinned public corpus (scripts/bench.sh).
on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    CARGO_TERM_COLOR: always
    # See tests.yml: scripts/lib/env.sh keeps the Go caches under storage/.
    GOCACHE: ${{ github.workspace }}/storage/.cache/go-build
    GOMODCACHE: ${{ github.workspace }}/storage/.cache/gopath/pkg/mod

concurrency:
    group: bench-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    bench:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7.0.1
              name: Checkout repository
              with:
                  fetch-depth: 0

            # rustup installs the version and components in rust-toolchain.toml.
            - name: Install Rust
              run: rustup toolchain install

            # The release-profile cache the binary job in tests.yml saves on
            # main. This workflow only runs on pull requests, so it never saves.
            - uses: Swatinem/rust-cache@v2
              name: Cache Cargo
              with:
                  prefix-key: v1-rust
                  shared-key: release
                  workspaces: '. -> storage/target'
                  save-if: false

            - uses: actions/setup-go@v7.0.0
              name: Install Go
              with:
                  go-version-file: go/helper/go.mod
                  cache-dependency-path: go/helper/go.sum

            # hyperfine 2 runs commands without a shell and changes the JSON
            # export, and scripts/bench.sh relies on both.
            - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
              name: Install hyperfine
              with:
                  tool: hyperfine@1

            # Both sides build in this checkout, so they share one target dir:
            # the base reuses the dependencies the head just compiled and only
            # rebuilds the workspace crates. A base that predates the Rust
            # workspace has nothing to compare.
            - name: Build base and head
              id: build
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  build() {
                      local out="$1"

                      ./scripts/task.sh build
                      mkdir -p "$out"
                      cp storage/target/release/fmtkit storage/go-helper/fmtkit-go-helper "$out/"
                  }

                  build "${PWD}/storage/bench/head"

                  if ! git cat-file -e "${BASE_SHA}:Cargo.toml" 2> /dev/null; then
                      echo 'base predates the Rust workspace; skipping the comparison'
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  head_sha="$(git rev-parse HEAD)"
                  git checkout --quiet --detach "$BASE_SHA"
                  build "${PWD}/storage/bench/base"
                  git checkout --quiet --detach "$head_sha"

            - name: Compare base and head
              if: steps.build.outputs.skip != 'true'
              run: ./scripts/bench.sh storage/bench/base storage/bench/head
